[package]
name = "cargo-horizon-mod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "cargo horizon-mod new/build/run/check: make Horizon content mods (docs/modding/src/how-to/content-mods.md)"

# `cargo binstall --git https://github.com/horizon-rust/horizon cargo-horizon-mod` (#2120) reads this: the archive
# `cargo-horizon-mod`'s workflow attaches to the `cargo-horizon-mod-v<version>` release for the runner's target,
# holding the binary at its root. tools/horizon_mod_binstall.py expands it for the workflow's targets.
[package.metadata.binstall]
pkg-url = "https://github.com/horizon-rust/horizon/releases/download/cargo-horizon-mod-v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
horizon-mod-api-gen = { path = "../horizon-mod-api-gen" }
cap-std = "3.4.6"
horizon-mod-package = { path = "../horizon-mod-package", default-features = false, features = ["index", "prebuilt"] }
horizon-port-pack = { path = "../horizon-port-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1.1.6"
toml_edit = "0.25"
ureq = { version = "2", default-features = false, features = ["tls"] }
wasm-encoder = "0.261"
wasmparser = "0.261"
wit-component = "0.261"
wit-parser = "0.261"

[dev-dependencies]
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
